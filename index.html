<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root{ --panel:rgba(18,24,34,.72); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:24px;
    background:radial-gradient(1200px 700px at 50% -10%, #2b3a52 0%, #141a24 55%, #0c1118 100%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    color:#e8eef6;-webkit-font-smoothing:antialiased;user-select:none;
  }
  .stage{
    width:100%;max-width:1080px;border-radius:22px;overflow:hidden;background:#cfeaff;line-height:0;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.14),
               inset 0 0 0 1px rgba(255,255,255,.2);
  }
  svg#scene{display:block;width:100%;height:auto;background:#cfeaff}

  /* ---------- 昼夜 ---------- */
  #nightTint,#stars,#moon,#beam{transition:opacity .9s ease}
  #nightTint,#stars,#moon,#beam{opacity:0}
  svg#scene.night #nightTint{opacity:.72}
  svg#scene.night #stars{opacity:1}
  svg#scene.night #moon{opacity:1}
  svg#scene.night #beam{opacity:.9}
  .twinkle{animation:twinkle 3.2s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

  /* ---------- 围巾 ---------- */
  .scarf{transform-box:fill-box;transform-origin:100% 45%}
  .scarf.a{animation:flapA 1.05s ease-in-out infinite alternate}
  .scarf.b{animation:flapB 1.35s ease-in-out infinite alternate}
  @keyframes flapA{from{transform:rotate(-10deg) skewY(-4deg)}to{transform:rotate(10deg) skewY(5deg)}}
  @keyframes flapB{from{transform:rotate(7deg) skewY(4deg)}to{transform:rotate(-12deg) skewY(-5deg)}}

  /* ---------- 尾尘 ---------- */
  .puff{animation:dust 1.05s ease-out infinite}
  .puff:nth-of-type(2){animation-delay:.35s}
  .puff:nth-of-type(3){animation-delay:.7s}
  @keyframes dust{
    0%{opacity:0;transform:translate(0,0) scale(.35)}
    22%{opacity:.5}
    100%{opacity:0;transform:translate(-86px,-34px) scale(2.1)}
  }

  /* ---------- 控制条 ---------- */
  .controls{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    padding:12px 18px;border-radius:999px;background:var(--panel);
    border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);
    box-shadow:0 18px 40px -22px rgba(0,0,0,.9);font-size:14px;
  }
  .controls .title{
    font-weight:600;letter-spacing:.5px;padding-right:12px;
    border-right:1px solid rgba(255,255,255,.15);color:#fff;
  }
  .controls .title span{opacity:.55;font-weight:400;font-size:12.5px;margin-left:6px}
  button{
    appearance:none;border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
    color:#eaf1f9;font:inherit;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.18s ease;
  }
  button:hover{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12));transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.primary{background:linear-gradient(180deg,#ffb457,#f08a24);border-color:rgba(255,255,255,.35);color:#2a1a05;font-weight:600}
  button.on{background:linear-gradient(180deg,#3f5f8f,#2b4165);border-color:rgba(150,200,255,.5)}
  input[type=range]{
    appearance:none;width:150px;height:6px;border-radius:999px;
    background:linear-gradient(90deg,#6fd0ff,#ffb457);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    appearance:none;width:18px;height:18px;border-radius:50%;
    background:#fff;border:2px solid #ffb457;box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .hint{font-size:12.5px;color:#9fb0c4;text-align:center;margin:0}
  @media (max-width:640px){
    .controls{gap:10px;padding:10px 12px}
    .controls .title{display:none}
    input[type=range]{width:110px}
  }
</style>
</head>

<script>
(function () {
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);

  /* ---------------- 几何参数 ---------------- */
  const BB      = { x: 415, y: 380 };
  const CRANK_R = 20;
  const HIP_N   = { x: 350, y: 286 };
  const HIP_F   = { x: 336, y: 280 };
  const THIGH   = 64;
  const SHIN    = 74;

  const CRANK_SPEED = 4.3;
  const WHEEL_GEAR  = 2.4;
  const ROAD_SPEED  = 520;

  /* ---------------- 辐条 ---------------- */
  function buildSpokes(group, count, len) {
    for (let i = 0; i < count; i++) {
      const l = document.createElementNS(NS, "line");
      l.setAttribute("x1", 0); l.setAttribute("y1", -len);
      l.setAttribute("x2", 0); l.setAttribute("y2", len);
      l.setAttribute("transform", "rotate(" + (i * 180 / count) + ")");
      l.setAttribute("stroke", "#b6c2ce");
      l.setAttribute("stroke-width", "1.5");
      group.appendChild(l);
    }
  }
  buildSpokes($("spokesRear"), 14, 44);
  buildSpokes($("spokesFront"), 14, 44);

  /* ---------------- 云 ---------------- */
  const cloudLayer = $("cloudLayer");
  const CLOUDS = [
    { x: 90,  y: 96,  s: 1.15, spd: 5.2,  op: .95 },
    { x: 430, y: 58,  s: .78,  spd: 3.4,  op: .8  },
    { x: 640, y: 152, s: .62,  spd: 8.0,  op: .68 },
    { x: 250, y: 172, s: .5,   spd: 11.0, op: .5  },
    { x: 800, y: 78,  s: .9,   spd: 4.2,  op: .85 }
  ];
  const cloudEls = CLOUDS.map(function (c) {
    const u = document.createElementNS(NS, "use");
    u.setAttribute("href", "#cloudShape");
    u.setAttribute("opacity", c.op);
    cloudLayer.appendChild(u);
    return u;
  });

  /* ---------------- 星星 ---------------- */
  const stars = $("stars");
  for (let i = 0; i < 70; i++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", (Math.random() * 900).toFixed(1));
    c.setAttribute("cy", (Math.random() * 400).toFixed(1));
    c.setAttribute("r", (Math.random() * 1.6 + 0.7).toFixed(2));
    c.setAttribute("fill", "#ffffff");
    c.setAttribute("class", "twinkle");
    c.style.animationDelay = (Math.random() * 3.2).toFixed(2) + "s";
    c.style.animationDuration = (2.2 + Math.random() * 3).toFixed(2) + "s";
    stars.appendChild(c);
  }

  /* ---------------- 两骨骼 IK ---------------- */
  function solveKnee(hx, hy, fx, fy, l1, l2) {
    let dx = fx - hx, dy = fy - hy;
    let d = Math.hypot(dx, dy) || 0.001;
    const maxD = l1 + l2 - 0.01, minD = Math.abs(l1 - l2) + 0.01;
    if (d > maxD) { const k = maxD / d; dx *= k; dy *= k; d = maxD; }
    else if (d < minD) { const k = minD / d; dx *= k; dy *= k; d = minD; }
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const ux = dx / d, uy = dy / d;
    const mx = hx + ux * a, my = hy + uy * a;
    const c1x = mx - uy * h, c1y = my + ux * h;   // 膝盖向后
    const c2x = mx + uy * h, c2y = my - ux * h;   // 膝盖向前
    return c2x >= c1x ? { x: c2x, y: c2y } : { x: c1x, y: c1y };
  }

  const el = {
    crankN: $("crankN"), crankF: $("crankF"),
    thighN: $("thighN"), shinN: $("shinN"),
    thighF: $("thighF"), shinF: $("shinF"),
    pedalN: $("pedalN"), pedalF: $("pedalF"),
    footN:  $("footN"),  footF:  $("footF"),
    spokesRear: $("spokesRear"), spokesFront: $("spokesFront"),
    pelican: $("pelican"), dashLayer: $("dashLayer"), chainTop: $("chainTop")
  };

  /* ---------------- 状态 ---------------- */
  let theta = 0, wheelAng = 0, roadOffset = 0, cloudT = 0, chainOffset = 0;
  let last = 0, playing = true, speed = 1;

  function seg(node, ax, ay, bx, by) {
    node.setAttribute("d", "M " + ax.toFixed(2) + " " + ay.toFixed(2) +
                            " L " + bx.toFixed(2) + " " + by.toFixed(2));
  }
  function place(node, x, y) {
    node.setAttribute("transform", "translate(" + x.toFixed(2) + "," + y.toFixed(2) + ")");
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    const cosT = Math.cos(theta), sinT = Math.sin(theta);

    const pN = { x: BB.x + CRANK_R * cosT, y: BB.y + CRANK_R * sinT };
    const pF = { x: BB.x - CRANK_R * cosT, y: BB.y - CRANK_R * sinT };
    const kN = solveKnee(HIP_N.x, HIP_N.y, pN.x, pN.y, THIGH, SHIN);
    const kF = solveKnee(HIP_F.x, HIP_F.y, pF.x, pF.y, THIGH, SHIN);

    seg(el.crankN, BB.x, BB.y, pN.x, pN.y);
    seg(el.thighN, HIP_N.x, HIP_N.y, kN.x, kN.y);
    seg(el.shinN,  kN.x, kN.y, pN.x, pN.y);
    place(el.pedalN, pN.x, pN.y);
    place(el.footN,  pN.x + 1, pN.y - 2);

    seg(el.crankF, BB.x, BB.y, pF.x, pF.y);
    seg(el.thighF, HIP_F.x, HIP_F.y, kF.x, kF.y);
    seg(el.shinF,  kF.x, kF.y, pF.x, pF.y);
    place(el.pedalF, pF.x, pF.y);
    place(el.footF,  pF.x + 1, pF.y - 2);

    const deg = wheelAng * 180 / Math.PI;
    el.spokesRear.setAttribute("transform", "rotate(" + deg.toFixed(1) + ")");
    el.spokesFront.setAttribute("transform", "rotate(" + deg.toFixed(1) + ")");

    el.chainTop.setAttribute("stroke-dashoffset", (-chainOffset).toFixed(1));
    el.pelican.setAttribute("transform",
      "translate(0," + (Math.sin(theta * 2) * 2.6).toFixed(2) + ")");
    el.dashLayer.setAttribute("transform",
      "translate(" + (-(roadOffset % 80)).toFixed(2) + ",0)");

    for (let i = 0; i < cloudEls.length; i++) {
      const c = CLOUDS[i];
      const x = (c.x + cloudT * c.spd) % 1400 - 250;
      cloudEls[i].setAttribute("transform",
        "translate(" + x.toFixed(1) + "," + c.y + ") scale(" + c.s + ")");
    }
  }

  /* ---------------- 主循环 ---------------- */
  function tick(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;

    if (playing) {
      theta       += CRANK_SPEED * speed * dt;
      wheelAng    += CRANK_SPEED * WHEEL_GEAR * speed * dt;
      roadOffset  += ROAD_SPEED * speed * dt;
      chainOffset += 90 * speed * dt;
      cloudT      += dt;
    }
    if (theta > Math.PI * 200) theta -= Math.PI * 200;
    if (wheelAng > Math.PI * 400) wheelAng -= Math.PI * 400;
    if (roadOffset > 1e6) roadOffset -= 1e6;
    if (chainOffset > 1e5) chainOffset -= 1e5;

    render();
    requestAnimationFrame(tick);
  }

  /* ---------------- 交互 ---------------- */
  const playBtn = $("playBtn"), nightBtn = $("nightBtn"), scene = $("scene");

  playBtn.addEventListener("click", function () {
    playing = !playing;
    playBtn.textContent = playing ? "⏸ 暂停" : "▶ 播放";
    playBtn.classList.toggle("primary", playing);
  });
  nightBtn.addEventListener("click", function () {
    const on = scene.classList.toggle("night");
    nightBtn.textContent = on ? "☀️ 白天" : "🌙 夜晚";
    nightBtn.classList.toggle("on", on);
  });

  const speedEl = $("speed"), speedVal = $("speedVal");
  speedEl.addEventListener("input", function () {
    speed = parseFloat(speedEl.value);
    speedVal.textContent = speed.toFixed(1) + "x";
  });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") { e.preventDefault(); playBtn.click(); }
  });

  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
